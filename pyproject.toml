[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "calmd"
version = "0.0.1"
description = 'A multi-dimensional, model independent calibration package.'
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = ["modeling", "calibration", "MSCUA"]
authors = [
    {name = "T.L. Blythe", email = "todd.blythe@mt.gov"},
    {name = "H. Haugen", email = "hannah.haugen@mt.gov"},
    {name = "E. Bilbrey", email= "evan.bilbrey@mt.gov"}
]
maintainers = [
    {name = "MT Dept. of Natural Resources and Conservation", email = "todd.blythe@mt.gov"}
]
classifiers = [
  #   3 - Alpha
  #   4 - Beta
  #   5 - Production/Stable
  "Development Status :: 3 - Alpha",

  # Indicate who your project is intended for
  "Intended Audience :: Water Scientists :: Modelers",
  "Topic :: Model Calibration",

  # Specify the Python versions you support here. In particular, ensure
  # that you indicate you support Python 3. These classifiers are *not*
  # checked by "pip install". See instead "requires-python" key in this file.
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
    "tqdm",
    "zarr",
    "xarray",
    "dask",
    "spotpy",
    "matplotlib"
]
[project.urls]
"Homepage" = "https://github.com/MTDNRC-WRD/calmd"
"Bug Reports" = "https://github.com/MTDNRC-WRD/calmd/issues"
"Source" = "https://github.com/MTDNRC-WRD/calmd/refs/heads/main.zip"